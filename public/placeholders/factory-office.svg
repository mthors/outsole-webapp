<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292925" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5DED2"/>
      <stop offset="100%" stop-color="#D9D0C3"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Architectural Building Schematic (Factory & Office) -->
  <g transform="translate(100, 140)">
    <!-- Main Plant Volume -->
    <rect x="40" y="100" width="420" height="220" fill="#292925" fill-opacity="0.04" stroke="#292925" stroke-width="2"/>
    
    <!-- Sawtooth Factory Roof -->
    <polygon points="40,100 90,50 90,100" fill="#77796B" fill-opacity="0.15" stroke="#292925" stroke-width="2"/>
    <polygon points="90,100 140,50 140,100" fill="#77796B" fill-opacity="0.15" stroke="#292925" stroke-width="2"/>
    <polygon points="140,100 190,50 190,100" fill="#77796B" fill-opacity="0.15" stroke="#292925" stroke-width="2"/>
    <polygon points="190,100 240,50 240,100" fill="#77796B" fill-opacity="0.15" stroke="#292925" stroke-width="2"/>

    <!-- Administrative Office Wing -->
    <rect x="260" y="40" width="280" height="280" fill="#FFFFFF" fill-opacity="0.75" stroke="#292925" stroke-width="2.5"/>
    
    <!-- Architectural Canopy / Entrance -->
    <rect x="290" y="240" width="100" height="80" fill="#083B7B" fill-opacity="0.08" stroke="#083B7B" stroke-width="2"/>
    <line x1="270" y1="240" x2="410" y2="240" stroke="#083B7B" stroke-width="4"/>
    
    <!-- Office Glass Curtain Grid -->
    <g stroke="#77796B" stroke-width="1.5" stroke-opacity="0.5">
      <line x1="310" y1="70" x2="310" y2="210"/>
      <line x1="360" y1="70" x2="360" y2="210"/>
      <line x1="410" y1="70" x2="410" y2="210"/>
      <line x1="460" y1="70" x2="460" y2="210"/>
      <line x1="510" y1="70" x2="510" y2="210"/>

      <line x1="280" y1="100" x2="520" y2="100"/>
      <line x1="280" y1="140" x2="520" y2="140"/>
      <line x1="280" y1="180" x2="520" y2="180"/>
      <line x1="280" y1="210" x2="520" y2="210"/>
    </g>

    <!-- Ochre Accent Band -->
    <rect x="260" y="40" width="280" height="6" fill="#A86C25"/>
    
    <!-- Pavement Line -->
    <line x1="0" y1="320" x2="600" y2="320" stroke="#292925" stroke-width="3"/>
  </g>

  <!-- Technical Overlay Details -->
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#77796B" letter-spacing="1.5">
    <text x="50" y="50">01 / CATEGORY: FACTORY &amp; OFFICE</text>
    <text x="750" y="50" text-anchor="end">LOC: SIDOARJO, INDONESIA</text>
    <text x="50" y="560">PT ODE CIPTA SEMESTA · FACILITY OVERVIEW</text>
    <text x="750" y="560" text-anchor="end">CAD REF: FAC-01-A</text>
  </g>

  <!-- Center Watermark Badge -->
  <g transform="translate(250, 480)">
    <rect x="0" y="0" width="300" height="34" rx="2" fill="#292925" fill-opacity="0.88"/>
    <text x="150" y="21" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#E5DED2" text-anchor="middle" letter-spacing="1.5">
      [PREVIEW PLACEHOLDER]
    </text>
  </g>
</svg>
